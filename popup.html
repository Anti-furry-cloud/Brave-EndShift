<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brave-EndShift</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <span class="logo" aria-hidden="true">▶</span>
        <div>
          <h1>Brave-EndShift <span id="version" class="version"></span></h1>
          <p id="videoStatus">Checking video…</p>
        </div>
      </header>

      <p class="intro">Choose where your video ends. Skip the outro on every loop.</p>

      <section id="controls" hidden>
        <div class="time-card">
          <span>Current time</span>
          <strong id="currentTime">00:00</strong>
        </div>

        <button id="setEnd" class="primary" type="button">
          Set ending here
        </button>

        <div id="savedPanel" class="saved" hidden>
          <span>Saved ending</span>
          <strong id="savedTime">00:00</strong>
          <p id="endBehavior" class="behavior"></p>
          <button id="clearEnd" class="danger" type="button">Remove ending</button>
        </div>
      </section>

      <p id="message" role="status" aria-live="polite"></p>
      <footer>Developed by <a href="https://github.com/Anti-furry-cloud" target="_blank" rel="noopener noreferrer">Anti-furry-cloud · GitHub</a></footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
