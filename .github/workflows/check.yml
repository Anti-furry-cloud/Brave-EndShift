name: Check and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate, test and package
        shell: powershell
        run: ./scripts/Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Brave-EndShift
          path: dist/Brave-EndShift-*
          if-no-files-found: error
